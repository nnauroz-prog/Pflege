# Render-Blueprint für das PflegeMatch-Backend (API + Datenbank).
# In Render: "New +" -> "Blueprint" -> dieses Repo wählen. Render liest diese Datei.
#
# Hinweis Datenpersistenz:
#  - Free-Tarif: läuft sofort, ABER die SQLite-Datei wird bei jedem Deploy/Neustart
#    zurückgesetzt (kein dauerhafter Speicher) und der Dienst schläft nach Inaktivität.
#  - Für DAUERHAFTE Daten: unten `plan: starter` setzen und den `disk`-Block
#    aktivieren (kostenpflichtig). Dann bleiben alle Leads/Vermittlungen erhalten.
services:
  - type: web
    name: pflegematch-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AKQUISE_LIVE
        value: "1"
      # Für persistente Daten (mit Disk, siehe unten) einkommentieren:
      # - key: DB_PATH
      #   value: /var/data/pflege.db

    # --- Für dauerhafte Daten: plan auf "starter" ändern und diesen Block aktivieren ---
    # disk:
    #   name: pflege-data
    #   mountPath: /var/data
    #   sizeGB: 1
